stages:
  - install
  - build
  - deploy

image: 192.168.111.61:5005/docker/node-internal

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: 192.168.111.61:5005
  CONTAINER_IMAGE: $REGISTRY/$CI_PROJECT_PATH
  
before_script:
  # Ensure that node works correctly
  - npm -v
  - node -v
  
install:
  stage: install
  script:
    - npm i
  cache:
    paths:
      - npm
    policy: push

build:
  stage: build
  script:
    # Install @angular/cli globally
    - npm i @angular/cli
    - npm run build:lib
  cache:
    paths:
      - npm
    policy: pull

deploy:
  stage: deploy
  script:
    - cd dist/kles-ng-pipe
    - npm publish --registry "http://192.168.111.61:8081/repository/npm-3kles/"  --force
  cache:
    paths:
      - npm
    policy: pull
