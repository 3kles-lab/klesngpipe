stages:
  - build
  - deploy

image: node:lts-alpine

variables:
  DOCKER_DRIVER: overlay2


# For internal build & publish
.repo-configuration: &configure-npm-repo
  # Configure internal repo
  - npm config set strict-ssl false
  - npm config set registry $NPM_REGISTRY
  - npm config set ca null
  - npm config set always-auth true
  - npm config set _auth $NPM_TOKEN

  
build:
  stage: build
  variables:
    NPM_REGISTRY: $NPM_PRIVATE_REGISTRY
    NPM_TOKEN: $NPM_PRIVATE_TOKEN
  before_script:
    - npm -v
    - node -v
    - *configure-npm-repo
  script:
    - npm i
    - npm i @angular/cli
    - npm run build:lib
  artifacts:
    expire_in: 1 hour
    paths:
        - dist


deploy-internal:
  stage: deploy
  except:
    - /^.*-dev$/
  variables:
    NPM_REGISTRY: $NPM_PRIVATE_REGISTRY_3KLES
    NPM_TOKEN: $NPM_PRIVATE_TOKEN
  before_script:
    - *configure-npm-repo
  script:
    - npm run publish:lib


deploy-public:
  stage: deploy
  only:
    - tags
  variables:
    NPM_USER: $NPM_PUBLIC_USER
    NPM_TOKEN: $NPM_PUBLIC_TOKEN
  before_script:
    # Connect to public NPM registry
    - export LIBRARY_NG=$(ls projects | head -n 1)
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > dist/$LIBRARY_NG/.npmrc
  script:
    # Publish the library
    - cd dist/$LIBRARY_NG
    - npm publish --force --access public
